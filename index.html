<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flarestamina — Ignite Your Endurance</title>
  <meta name="description" content="Flarestamina — Ignite Your Endurance. Build better habits. Achieve bigger goals. A complete IELTS study platform." />
  <meta name="theme-color" content="#059669" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script>
    // Apply persisted theme before paint to avoid flash.
    (function () {
      try {
        var t = localStorage.getItem("flare-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --accent:#10b981; --accent-strong:#34d399; --accent-ink:#6ee7b7;
      --bg:#0a0e0c; --surface:#111814; --surface-2:#172019; --border:#212d26;
      --text:#e9efea; --muted:#8ba095; --faint:#5e7068;
      --radius:18px; --maxw:1080px;
      --shadow:0 10px 40px -12px rgba(0,0,0,.55);
      --glow:0 0 0 1px rgba(16,185,129,.25), 0 14px 50px -16px rgba(16,185,129,.45);
      --font:"Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      --mono:"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    [data-theme="light"] {
      --accent:#059669; --accent-strong:#047857; --accent-ink:#065f46;
      --bg:#f4f7f5; --surface:#ffffff; --surface-2:#eaf1ed; --border:#d4e0d9;
      --text:#0c1410; --muted:#4d6157; --faint:#7d9488;
      --shadow:0 10px 36px -16px rgba(16,40,30,.28);
      --glow:0 0 0 1px rgba(5,150,105,.22), 0 16px 44px -18px rgba(5,150,105,.32);
    }
    * { box-sizing:border-box; }
    html, body { margin:0; padding:0; }
    body {
      font-family:var(--font); background:var(--bg); color:var(--text);
      min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.5;
      overflow-x:hidden;
    }
    a { color:inherit; text-decoration:none; }
    .wrap { max-width:var(--maxw); margin:0 auto; padding:0 22px; }
    .logo { width:1em; height:1em; display:inline-block; vertical-align:-.14em; }

    /* Top bar */
    .topbar { position:absolute; top:0; left:0; right:0; z-index:5; }
    .topbar .wrap { display:flex; align-items:center; justify-content:space-between; padding-top:18px; padding-bottom:18px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-.01em; }
    .brand .logo { font-size:26px; }
    .icon-btn {
      display:inline-grid; place-items:center; width:42px; height:42px; border-radius:12px;
      background:var(--surface); border:1px solid var(--border); color:var(--text);
      cursor:pointer; transition:transform .15s ease, background .2s ease, border-color .2s ease;
    }
    .icon-btn:hover { transform:translateY(-1px); border-color:var(--accent); }
    .icon-btn svg { width:20px; height:20px; }
    .sun { display:none; } .moon { display:block; }
    [data-theme="light"] .sun { display:block; } [data-theme="light"] .moon { display:none; }

    /* Hero */
    .hero {
      min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; position:relative; padding:90px 22px 40px;
      background:
        radial-gradient(80% 55% at 50% 0%, rgba(16,185,129,.16), transparent 70%),
        radial-gradient(60% 40% at 50% 100%, rgba(16,185,129,.07), transparent 70%);
    }
    .hero-logo { font-size:96px; line-height:1; filter:drop-shadow(0 12px 36px rgba(16,185,129,.45)); animation:floaty 5s ease-in-out infinite; }
    @keyframes floaty { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10px);} }
    .wordmark {
      font-size:clamp(48px, 9vw, 104px); font-weight:800; letter-spacing:-.035em; margin:14px 0 0;
      background:linear-gradient(180deg, var(--text), color-mix(in oklab, var(--text) 62%, var(--muted)));
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .slogan { font-size:clamp(20px, 3.4vw, 30px); font-weight:700; color:var(--accent-strong); margin:18px 0 6px; letter-spacing:-.01em; }
    .subslogan { font-size:clamp(15px, 2.2vw, 19px); color:var(--muted); margin:0; }
    .scrolldown {
      position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
      color:var(--faint); display:grid; place-items:center; gap:6px; font:600 11px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase;
    }
    .scrolldown svg { width:26px; height:26px; animation:bounce 1.8s ease-in-out infinite; }
    @keyframes bounce { 0%,100%{ transform:translateY(0); opacity:.55;} 50%{ transform:translateY(8px); opacity:1;} }

    /* Tools */
    .tools { padding:30px 0 80px; }
    .tools h2 { font-size:13px; letter-spacing:.22em; text-transform:uppercase; color:var(--faint); font-family:var(--mono); text-align:center; margin:0 0 26px; }
    .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:18px; }
    @media (max-width:720px){ .grid { grid-template-columns:1fr; } }
    .card {
      position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
      padding:24px; display:flex; gap:18px; align-items:flex-start;
      opacity:0; transform:translateY(18px); animation:riseIn .6s cubic-bezier(.2,.7,.2,1) forwards;
      transition:transform .2s ease, border-color .2s ease, box-shadow .25s ease;
    }
    @keyframes riseIn { to { opacity:1; transform:translateY(0); } }
    .card-ico { flex:none; width:50px; height:50px; border-radius:14px; display:grid; place-items:center; background:var(--surface-2); color:var(--muted); border:1px solid var(--border); }
    .card-ico svg { width:26px; height:26px; }
    .card-body { flex:1; min-width:0; }
    .card h3 { margin:2px 0 6px; font-size:19px; font-weight:700; letter-spacing:-.01em; }
    .card p { margin:0; color:var(--muted); font-size:14.5px; }
    .badge { font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; padding:5px 9px; border-radius:999px; display:inline-block; }
    .badge.active { color:#04130d; background:linear-gradient(180deg, var(--accent-strong), var(--accent)); }
    .badge.soon { color:var(--faint); background:var(--surface-2); border:1px solid var(--border); }
    .card-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }

    .card.active {
      border-left:3px solid var(--accent); cursor:pointer; box-shadow:var(--glow);
    }
    .card.active .card-ico { color:var(--accent-strong); background:color-mix(in oklab, var(--accent) 14%, var(--surface-2)); border-color:color-mix(in oklab, var(--accent) 35%, var(--border)); }
    .card.active:hover { transform:translateY(-4px); box-shadow:0 0 0 1px rgba(16,185,129,.4), 0 22px 60px -20px rgba(16,185,129,.55); }
    .card.soon { cursor:default; }
    .card.soon .card-body { opacity:.72; }
    .start-btn {
      margin-top:16px; display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:14px;
      padding:10px 16px; border-radius:11px; color:#04130d;
      background:linear-gradient(180deg, var(--accent-strong), var(--accent));
      box-shadow:0 8px 22px -10px rgba(16,185,129,.7); transition:transform .15s ease, gap .15s ease;
    }
    .card.active:hover .start-btn { gap:12px; }
    .start-btn svg { width:16px; height:16px; }

    footer { border-top:1px solid var(--border); padding:26px 0; text-align:center; color:var(--faint); font-size:13px; }
    footer .mono { font-family:var(--mono); }

    @media (prefers-reduced-motion: reduce) {
      .card { opacity:1; transform:none; animation:none; }
      .hero-logo, .scrolldown svg { animation:none; }
    }
  </style>
</head>
<body>
  <!-- Flame sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#059669" />
        <stop offset=".55" stop-color="#10b981" />
        <stop offset="1" stop-color="#6ee7b7" />
      </linearGradient>
      <symbol id="flame" viewBox="0 0 32 32">
        <path d="M16 3 C 15 9 11 11 11 17 C 11 22 13 26 16.5 26 C 20 26 22 22.5 22 18.5 C 22 15 20.5 12.5 19.5 10 C 19.2 12.5 18 13.5 17 13 C 18.2 9.5 17 6 16 3 Z" fill="url(#flameGrad)" />
        <path d="M16.8 14 C 16 17 14 18.5 14 21 C 14 23.2 15.4 25 17 25 C 18.7 25 20 23.4 20 21.4 C 20 18.8 18 16.8 16.8 14 Z" fill="#d1fae5" opacity=".9" />
      </symbol>
    </defs>
  </svg>

  <div class="topbar">
    <div class="wrap">
      <a class="brand" href="/"><svg class="logo"><use href="#flame" /></svg> Flarestamina</a>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>

  <header class="hero">
    <svg class="logo hero-logo"><use href="#flame" /></svg>
    <h1 class="wordmark">Flarestamina</h1>
    <p class="slogan">Ignite Your Endurance.</p>
    <p class="subslogan">Build better habits. Achieve bigger goals.</p>
    <a class="scrolldown" href="#tools" aria-label="Scroll to tools">
      Explore
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </a>
  </header>

  <main class="wrap tools" id="tools">
    <h2>The Toolkit</h2>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <span class="mono">Built with passion · Flarestamina © 2026</span>
  </footer>

  <script>
    // Theme toggle
    var toggle = document.getElementById("themeToggle");
    toggle.addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
      var next = cur === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("flare-theme", next); } catch (e) {}
    });

    // Icons (inline SVG paths)
    var I = {
      challenge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M9 15l2 2 4-4"/></svg>',
      hub: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
      essay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
      picker: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>',
      error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.6a2 2 0 0 1 3.4 0l7.6 13a2 2 0 0 1-1.7 3H4.4a2 2 0 0 1-1.7-3z"/><path d="M12 9v4M12 17h.01"/></svg>',
      vocab: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>'
    };

    var cards = [
      { ico:I.challenge, title:"40-Day Challenge", desc:"A guided 40-day IELTS endurance plan with daily tasks across all four skills.", active:true, href:"/challenge/" },
      { ico:I.hub, title:"IELTS Practice Hub", desc:"Curated listening, reading, writing and speaking practice in one place." },
      { ico:I.essay, title:"Essay Platform", desc:"Draft, structure and refine Task 1 & Task 2 essays with feedback." },
      { ico:I.picker, title:"Random Name Picker", desc:"Fair, fun name selection for classes and speaking partners." },
      { ico:I.error, title:"IELTS Error Tracker", desc:"Log recurring mistakes and watch your weak spots shrink over time." },
      { ico:I.vocab, title:"VocabBank", desc:"Build and review your personal bank of words, idioms and collocations." }
    ];

    var grid = document.getElementById("grid");
    cards.forEach(function (c, i) {
      var el = document.createElement(c.active ? "a" : "div");
      el.className = "card " + (c.active ? "active" : "soon");
      el.style.animationDelay = (i * 80) + "ms";
      if (c.active) el.href = c.href;
      el.innerHTML =
        '<div class="card-ico">' + c.ico + '</div>' +
        '<div class="card-body">' +
          '<div class="card-top">' +
            '<h3>' + c.title + '</h3>' +
            '<span class="badge ' + (c.active ? 'active' : 'soon') + '">' + (c.active ? 'Active' : 'Coming Soon') + '</span>' +
          '</div>' +
          '<p>' + c.desc + '</p>' +
          (c.active ? '<span class="start-btn">Start Now <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>' : '') +
        '</div>';
      grid.appendChild(el);
    });

    // PWA
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        try { navigator.serviceWorker.register("./sw.js"); } catch (e) {}
      });
    }
  </script>
</body>
</html>
